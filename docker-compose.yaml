version: '3.8'

services:
  app:
    image: webdevops/php-nginx:8.3
    container_name: chilux_crm_app
    ports:
      - "8002:80"
    volumes:
      - .:/var/www/html
    environment:
      - WEB_DOCUMENT_ROOT=/var/www/html/public
    working_dir: /var/www/html
    depends_on:
      - mysql
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: chilux_crm_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret123
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: chilux_crm_phpmyadmin
    ports:
      - "8081:80"
    environment:
  PMA_HOST: mysql
  PMA_USER: root
  PMA_PASSWORD: secret123
    depends_on:
      - mysql
    networks:
      - laravel

  maildev:
    image: maildev/maildev
    container_name: chilux_crm_maildev
    ports:
      - "1081:1080"
      - "1026:1025"
    networks:
      - laravel

volumes:
  mysql_data:

networks:
  laravel:
    driver: bridge
